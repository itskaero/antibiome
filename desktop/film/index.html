<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Antibiome PICU — film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 1920×1080 frame-accurate composition. Every frame is a pure function of t (seconds): window.seek(t).
   Colours, type, radii and components follow the app's own dark theme (desktop/src/styles.css). */
:root {
  --backdrop: #0a0a0a; --shell: #121212; --panel: #1a1a1a; --panel-2: #212121; --panel-3: #2a2a2a;
  --line: #262626; --line-2: #333333; --text: #f1f1f1; --text-2: #a8a8a8; --text-3: #6e6e6e;
  --accent: #f26b3a; --accent-ink: #ff8a5c; --accent-soft: rgba(242,107,58,0.13);
  --good: #0ca30c; --good-ink: #4cc76a; --good-soft: rgba(12,163,12,0.16);
  --warn: #fab219; --warn-ink: #f8c04a; --warn-soft: rgba(250,178,25,0.15);
  --crit: #d03b3b; --crit-ink: #f07070; --crit-soft: rgba(208,59,59,0.17);
  --info-ink: #6aa8f0; --info-soft: rgba(57,135,229,0.15);
  --series-1: #3987e5; --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--backdrop); }
.layer { position: absolute; inset: 0; }
.abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
.mono { font-family: var(--mono); }
#bg { position: absolute; inset: -10%; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,0.65) 100%); }
#grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.035; mix-blend-mode: screen; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: overlay; }

/* app components */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 30px 60px -30px rgba(0,0,0,0.8); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500; background: var(--panel-3); color: var(--text-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good-ink); } .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.crit { background: var(--crit-soft); color: var(--crit-ink); } .chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.info { background: var(--info-soft); color: var(--info-ink); }
.label { font: 500 12px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.cell { display: grid; place-items: center; border-radius: 7px; font: 600 15px var(--sans); font-variant-numeric: tabular-nums; }
.c-good { background: var(--good-soft); color: var(--good-ink); } .c-warn { background: var(--warn-soft); color: var(--warn-ink); } .c-crit { background: var(--crit-soft); color: var(--crit-ink); } .c-none { background: transparent; color: var(--text-3); }
.tnum { font-variant-numeric: tabular-nums; }

/* scene 1 */
.frag { position: absolute; left: 0; top: 0; white-space: nowrap; font: 500 18px var(--mono); color: var(--text-2); transform-origin: 50% 50%; }
.frag.pill { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid var(--line-2); }
.frag.r { color: var(--crit-ink); border-color: rgba(208,59,59,0.5); } .frag.s { color: var(--good-ink); border-color: rgba(12,163,12,0.5); }
.frag.org { font: italic 500 21px var(--sans); color: var(--text); }
.frag.big { font: 600 24px var(--sans); color: var(--text); }
.headline { position: absolute; left: 0; width: 1920px; text-align: center; font: 600 96px/1.05 var(--sans); letter-spacing: -0.035em; color: #fff; }
.headline span { display: inline-block; white-space: pre; }
.hl { color: var(--accent); }

/* scene 2 */
.node { width: 300px; height: 150px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.node .t { font: 600 24px/1.15 var(--sans); }
.node .s { color: var(--text-2); font-size: 15px; }
.astrow { display: flex; flex-wrap: wrap; gap: 6px; }
.rec { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px; color: var(--text-2); }
.rec b { font-weight: 500; color: var(--text); }
.rec i { color: var(--text); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* scene 3: the app */
#cam3 { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 40%; }
#world3 { position: absolute; left: 160px; top: 90px; width: 1600px; height: 1240px; transform-style: preserve-3d; transform-origin: 50% 30%; }
.side { position: absolute; left: 0; top: 0; width: 250px; height: 1240px; padding: 18px; }
.nav { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 12px; font-size: 15px; color: var(--text-2); }
.nav.on { background: var(--panel-3); color: var(--text); font-weight: 600; }
.nav .ic { width: 16px; height: 16px; border-radius: 4px; border: 1.6px solid var(--text-3); }
.nav.on .ic { border-color: var(--accent); }
.kbd { font: 11px var(--mono); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--text-3); margin-left: auto; }
.kpi { width: 248px; height: 170px; padding: 18px 20px; }
.kpi .k { font-size: 14px; color: var(--text-3); }
.kpi .v { font: 600 44px/1 var(--sans); margin-top: 14px; letter-spacing: -0.02em; }
.kpi .v small { font-size: 22px; color: var(--text-3); font-weight: 500; }
.kpi .sub { font-size: 13px; color: var(--text-3); margin-top: 12px; line-height: 1.4; }
.ctitle { font: 600 18px var(--sans); }
.notice { display: flex; gap: 12px; align-items: flex-start; }
.notice .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 600 15px var(--sans); flex: none; }

/* scene 4 */
.lane { position: absolute; height: 26px; border-radius: 7px; display: flex; align-items: center; padding: 0 9px; font: 600 13px var(--sans); color: #fff; white-space: nowrap; overflow: hidden; }
.tag { position: absolute; font: 500 14px var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 12px; }
.tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
.ccard { width: 270px; height: 150px; padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; }
.ccard .o { font: italic 600 17px/1.2 var(--sans); }
.bed { width: 220px; height: 130px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.panel { position: absolute; padding: 22px 24px; }

/* scene 5 */
.word { position: absolute; left: 0; width: 1920px; text-align: center; }
.word span { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="layer" id="L1"></div>
  <div class="layer" id="L2"></div>
  <div class="layer" id="L3"><div id="cam3"><div id="world3"></div></div></div>
  <div class="layer" id="L4"></div>
  <div class="layer" id="L5"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="960" height="540"></canvas>
  <div id="flash"></div>
</div>
<script src="data.js"></script>
<script>
'use strict';
const D = window.DATA;
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;

// ── maths & motion ───────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outCubic: p => 1 - Math.pow(1 - p, 3), inCubic: p => p * p * p, outQuint: p => 1 - Math.pow(1 - p, 5),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)), inExpo: p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  inOutExpo: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  inBack: p => { const c1 = 1.70158, c3 = c1 + 1; return c3 * p * p * p - c1 * p * p; },
};
/** Damped spring 0→1 over time since `start` (overshoot + settle). */
const spring = (t, start, f = 2.1, z = 0.45) => {
  const dt = t - start; if (dt <= 0) return 0;
  const w = 2 * Math.PI * f; return 1 - Math.exp(-z * w * dt) * Math.cos(w * Math.sqrt(1 - z * z) * dt);
};
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = a => a[Math.floor(rnd() * a.length)];

function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; }
function put(e, o) {
  const x = o.x ?? 0, y = o.y ?? 0, z = o.z ?? 0, s = o.s ?? 1, r = o.r ?? 0, op = o.o ?? 1;
  const rx = o.rx ?? 0, ry = o.ry ?? 0;
  e.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(1)}px)${rx ? ` rotateX(${rx}deg)` : ''}${ry ? ` rotateY(${ry}deg)` : ''}${r ? ` rotate(${r.toFixed(2)}deg)` : ''} scale(${(o.sx ?? s).toFixed(4)},${(o.sy ?? s).toFixed(4)})`;
  e.style.opacity = op.toFixed(3);
  const b = o.blur ?? 0; e.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
  e.style.visibility = op <= 0.002 ? 'hidden' : 'visible';
}
const show = (e, on) => { e.style.display = on ? '' : 'none'; };
const fmtInt = v => Math.round(v).toLocaleString('en-GB');
const sCell = v => (v == null ? 'c-none' : v >= 80 ? 'c-good' : v >= 50 ? 'c-warn' : 'c-crit');
const awareColor = g => (g === 'Access' ? 'var(--good)' : g === 'Watch' ? 'var(--warn)' : g === 'Reserve' ? 'var(--crit)' : 'var(--text-3)');
const LOGO = (size, stroke = 'var(--accent)') => `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="${stroke}" stroke-width="3"/><ellipse cx="16" cy="16" rx="15" ry="6" fill="none" stroke="${stroke}" stroke-width="2" transform="rotate(-28 16 16)" opacity="0.7"/><circle cx="16" cy="16" r="4.5" fill="${stroke}"/></svg>`;

const $ = id => document.getElementById(id);
const L = { 1: $('L1'), 2: $('L2'), 3: $('L3'), 4: $('L4'), 5: $('L5') };
const WINDOWS = { 1: [0, 5.35], 2: [4.95, 12.25], 3: [11.85, 25.2], 4: [24.85, 36.6], 5: [35.85, 45.1] };

// ═══════════ SCENE 1 · the data problem (0–5 s) ═══════════
const S1 = { frags: [], lines: [] };
(function build1() {
  const P = D.patient, texts = [];
  D.cultures.forEach(c => {
    texts.push({ t: c.organism, c: 'org' });
    texts.push({ t: `${c.specimen} · ${c.date}`, c: '' });
    c.ast.slice(0, 2).forEach(([d, r]) => texts.push({ t: `${d}  ${r}`, c: `pill ${r === 'R' ? 'r' : r === 'S' ? 's' : ''}` }));
    if (c.mdr) texts.push({ t: 'MDR', c: 'pill r' });
  });
  D.census.forEach(b => { texts.push({ t: `Bed ${b.bed} · ${b.dx}`, c: 'big' }); texts.push({ t: `${b.id} · ${b.resp}`, c: 'pill' }); b.abx.forEach(a => texts.push({ t: a, c: '' })); });
  P.vitals.forEach(v => { texts.push({ t: `HR ${v.hr} /min`, c: 'pill' }); texts.push({ t: `SBP ${v.sbp} mmHg`, c: 'pill' }); if (v.lactate) texts.push({ t: `Lactate ${v.lactate} mmol/L`, c: 'pill r' }); texts.push({ t: v.at.replace('T', ' '), c: '' }); });
  D.stewardship.months.forEach(m => texts.push({ t: `${m.month} · DOT ${m.per1000}`, c: '' }));
  texts.push({ t: `PIM3 ${(P.pim3 * 100).toFixed(1)}%`, c: 'pill' }, { t: `SMR ${D.dashboard.smr.smr.toFixed(2)}`, c: 'big' }, { t: `${D.antibiogram.isolates} isolates`, c: 'big' });
  // shuffle deterministically and keep a dense but readable field
  for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
  const N = 170;
  for (let i = 0; i < N; i++) {
    const f = texts[i % texts.length];
    const e = el('div', `frag ${f.c}`, L[1], f.t);
    const ang = rnd() * Math.PI * 2, rad = 120 + Math.pow(rnd(), 0.7) * 1050;
    S1.frags.push({ e, ts: 4.55 * Math.pow(i / N, 0.62), x: CX + Math.cos(ang) * rad * 1.15, y: CY + Math.sin(ang) * rad * 0.62, d: 0.55 + rnd() * 1.05, rot: (rnd() - 0.5) * 6 });
  }
  // sparkline fragments (real census series)
  for (let k = 0; k < 6; k++) {
    const series = k % 2 ? D.dashboard.censusPrev : D.stewardship.months.map(m => m.per1000);
    const pts = series.filter(v => v != null).map((v, i, a) => `${(i / (a.length - 1)) * 160},${40 - (v / Math.max(...a)) * 36}`).join(' ');
    const e = el('div', 'frag', L[1], `<svg width="160" height="42"><polyline points="${pts}" fill="none" stroke="${k % 3 ? 'var(--accent)' : 'var(--info-ink)'}" stroke-width="2"/></svg>`);
    const ang = rnd() * Math.PI * 2, rad = 260 + rnd() * 700;
    S1.frags.push({ e, ts: 0.6 + k * 0.62, x: CX + Math.cos(ang) * rad, y: CY + Math.sin(ang) * rad * 0.6, d: 0.8 + rnd() * 0.6, rot: 0 });
  }
  S1.veil = el('div', 'abs', L[1]); S1.veil.style.cssText += 'width:1920px;height:1080px;background:radial-gradient(60% 50% at 50% 50%, rgba(10,10,10,0.92), rgba(10,10,10,0.55) 70%, rgba(10,10,10,0.2));';
  const mk = (words, y) => { const h = el('div', 'headline', L[1]); h.style.top = `${y}px`; const spans = words.map(w => el('span', w.hl ? 'hl' : '', h, w.t)); return { h, spans }; };
  S1.lines = [
    mk([{ t: 'PICU ' }, { t: 'data ' }, { t: 'is ' }, { t: 'everywhere.' }], 470),
    mk([{ t: 'The ' }, { t: 'intelligence', hl: 1 }, { t: ' is hidden' }], 420),
    mk([{ t: 'inside ' }, { t: 'it.' }], 525),
  ];
})();
function render1(t) {
  const collapse = seg(t, 4.78, 5.15), pull = seg(t, 4.55, 4.78);
  const dim = Math.max(seg(t, 2.35, 2.75) * 0.75, 0);
  S1.frags.forEach(f => {
    const a = t - f.ts;
    if (a < 0) { put(f.e, { o: 0 }); return; }
    const grow = 1 + 0.22 * a;
    let x = CX + (f.x - CX) * (1 + 0.16 * a) * (1 + 0.04 * pull), y = CY + (f.y - CY) * (1 + 0.16 * a) * (1 + 0.04 * pull);
    const c = E.inExpo(collapse);
    x = lerp(x, CX, c); y = lerp(y, CY, c);
    const op = E.outCubic(seg(a, 0, 0.18)) * (1 - dim * 0.8) * (1 - c) * (f.d < 0.75 ? 0.55 : 1);
    put(f.e, { x: x - 80, y: y - 14, s: f.d * grow * (1 - c * 0.85), r: f.rot, o: op, blur: (f.d < 0.75 ? 2.4 : f.d > 1.45 ? 1.6 : 0) + c * 6 });
  });
  put(S1.veil, { o: seg(t, 2.3, 2.7) * (1 - seg(t, 4.9, 5.2)) });
  const word = (sp, i, t0, t1) => { const p = E.outCubic(seg(t, t0 + i * 0.07, t0 + i * 0.07 + 0.5)), out = seg(t, t1, t1 + 0.35); put(sp, { y: (1 - p) * 46 - out * 30, o: p * (1 - out), blur: (1 - p) * 10 + out * 8 }); };
  S1.lines[0].spans.forEach((s, i) => word(s, i, 2.45, 3.82));
  S1.lines[1].spans.forEach((s, i) => word(s, i, 4.0, 4.82));
  S1.lines[2].spans.forEach((s, i) => word(s, i, 4.18, 4.82));
}

// ═══════════ SCENE 2 · data organises itself (5–12 s) ═══════════
const S2 = { nodes: [], recs: [], cells: [], bars: [] };
(function build2() {
  const C = D.chain;
  const astHtml = C.ast.map(([d, r]) => `<span class="chip ${r === 'R' ? 'crit' : 'good'}">${d.replace('Piperacillin-Tazobactam', 'Pip-Taz')} ${r}</span>`).join('');
  const specs = [
    ['Patient', C.patient.id, `${C.patient.dx} · ${Math.floor(C.patient.age / 12)} y`],
    ['Culture', `${C.culture.specimen} culture`, `Collected ${C.culture.date}`],
    ['Organism', `<i>${C.organism}</i>`, C.mdr ? '<span class="chip crit">MDR</span>' : 'not MDR'],
    ['Sensitivity', '', `<div class="astrow">${astHtml}</div>`],
    ['Antibiotic', C.antibiotic.drug, `<span class="chip" style="background:rgba(208,59,59,.17);color:var(--crit-ink)">${C.antibiotic.group}</span> ${C.antibiotic.intent}`],
  ];
  S2.svg = el('div', 'abs', L[2]); S2.svg.innerHTML = '<svg width="1920" height="1080"></svg>';
  const svg = S2.svg.firstChild;
  specs.forEach((s, i) => {
    const n = el('div', 'abs card node', L[2], `<span class="label">${s[0]}</span>${s[1] ? `<span class="t">${s[1]}</span>` : ''}<span class="s">${s[2]}</span>`);
    if (i === 3) n.style.gap = '12px';
    S2.nodes.push({ e: n, x: 120 + i * 350, y: 455 });
  });
  for (let i = 0; i < 4; i++) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${120 + i * 350 + 300} 530 L ${120 + (i + 1) * 350} 530`); p.setAttribute('stroke', 'var(--accent)'); p.setAttribute('stroke-width', '2.5'); p.setAttribute('fill', 'none');
    p.setAttribute('stroke-dasharray', '50'); svg.appendChild(p);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dot.setAttribute('r', '5'); dot.setAttribute('fill', 'var(--accent)'); svg.appendChild(dot);
    S2.svg[`l${i}`] = p; S2.svg[`d${i}`] = dot;
  }
  S2.caption = el('div', 'abs label', L[2], 'Patient → Culture → Organism → Sensitivity → Antibiotic'); S2.caption.style.fontSize = '15px';
  // many records
  D.cultures.slice(0, 26).forEach((c, i) => {
    const dots = c.ast.slice(0, 5).map(([, r]) => `<span class="dot" style="background:${r === 'R' ? 'var(--crit)' : r === 'S' ? 'var(--good)' : 'var(--warn)'}"></span>`).join('');
    const e = el('div', 'abs rec', L[2], `<b class="mono" style="font-size:12px;color:var(--text-3)">${c.date}</b> <span class="chip" style="padding:2px 8px;font-size:12px">${c.specimen}</span> <i>${c.organism}</i> ${dots}${c.mdr ? ' <span class="chip crit" style="padding:2px 8px;font-size:11px">MDR</span>' : ''}`);
    S2.recs.push({ e, x: 110 + (i % 2) * 420, y: 250 + Math.floor(i / 2) * 44 });
  });
  // antibiogram matrix (real, first isolate per patient)
  const A = D.antibiogram, mx = 1130, my = 300, cw = 74, ch = 44;
  S2.matrixHead = el('div', 'abs', L[2], A.drugs.map((d, j) => `<div style="position:absolute;left:${j * cw}px;top:0;width:${cw}px;transform:rotate(-40deg);transform-origin:0 100%;font-size:13px;color:var(--text-3);white-space:nowrap">${d.replace('Piperacillin-Tazobactam', 'Pip-Taz')}</div>`).join(''));
  S2.orgLabels = [];
  A.rows.forEach((r, i) => {
    const lab = el('div', 'abs', L[2], `<i style="font-size:15px">${r.organism.replace('Coagulase-negative Staphylococci (CoNS)', 'CoNS')}</i> <span style="font-size:12px;color:var(--text-3)">n=${r.n}</span>`);
    lab.style.width = '300px'; lab.style.textAlign = 'right';
    S2.orgLabels.push({ e: lab, x: mx - 320, y: my + 36 + i * (ch + 6) + 12 });
    r.cells.forEach((v, j) => {
      const c = el('div', `abs cell ${sCell(v)}`, L[2], v == null ? '·' : '');
      c.style.width = `${cw - 6}px`; c.style.height = `${ch}px`;
      S2.cells.push({ e: c, v, i, j, x: mx + j * cw, y: my + 36 + i * (ch + 6), sx: 110 + (i % 2) * 420 + 200 + rnd() * 120, sy: 250 + ((i * 3 + j) % 13) * 44 * 2 });
    });
  });
