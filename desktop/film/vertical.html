<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Antibiome PICU — vertical film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 1080×1920 portrait cut of index.html for phones (WhatsApp, Status, Reels), 50 s: the same story and
   material re-laid out for a tall screen, ending on a download card with the link and a QR code.
   Every frame is a pure function of t (seconds): window.seek(t). */
:root {
  --backdrop: #0a0a0a; --shell: #121212; --panel: #1a1a1a; --panel-2: #212121; --panel-3: #2a2a2a;
  --line: #262626; --line-2: #333333; --text: #f1f1f1; --text-2: #a8a8a8; --text-3: #6e6e6e;
  --accent: #f26b3a; --accent-ink: #ff8a5c; --accent-soft: rgba(242,107,58,0.13);
  --good: #0ca30c; --good-ink: #4cc76a; --good-soft: rgba(12,163,12,0.16);
  --warn: #fab219; --warn-ink: #f8c04a; --warn-soft: rgba(250,178,25,0.15);
  --crit: #d03b3b; --crit-ink: #f07070; --crit-soft: rgba(208,59,59,0.17);
  --info-ink: #6aa8f0; --info-soft: rgba(57,135,229,0.15);
  --series-1: #3987e5; --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--backdrop); }
.layer { position: absolute; inset: 0; }
.abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
.mono { font-family: var(--mono); }
#bg { position: absolute; inset: -10%; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,0.65) 100%); }
#grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: 0.035; mix-blend-mode: screen; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: overlay; }

/* app components */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 30px 60px -30px rgba(0,0,0,0.8); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500; background: var(--panel-3); color: var(--text-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good-ink); } .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.crit { background: var(--crit-soft); color: var(--crit-ink); } .chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.info { background: var(--info-soft); color: var(--info-ink); }
.label { font: 500 12px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.cell { display: grid; place-items: center; border-radius: 7px; font: 600 15px var(--sans); font-variant-numeric: tabular-nums; }
.c-good { background: var(--good-soft); color: var(--good-ink); } .c-warn { background: var(--warn-soft); color: var(--warn-ink); } .c-crit { background: var(--crit-soft); color: var(--crit-ink); } .c-none { background: transparent; color: var(--text-3); }
.tnum { font-variant-numeric: tabular-nums; }

/* scene 1 */
.frag { position: absolute; left: 0; top: 0; white-space: nowrap; font: 500 18px var(--mono); color: var(--text-2); transform-origin: 50% 50%; }
.frag.pill { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid var(--line-2); }
.frag.r { color: var(--crit-ink); border-color: rgba(208,59,59,0.5); } .frag.s { color: var(--good-ink); border-color: rgba(12,163,12,0.5); }
.frag.org { font: italic 500 21px var(--sans); color: var(--text); }
.frag.big { font: 600 24px var(--sans); color: var(--text); }
.headline { position: absolute; left: 0; width: 1080px; text-align: center; font: 600 100px/1.05 var(--sans); letter-spacing: -0.035em; color: #fff; }
.headline span { display: inline-block; white-space: pre; }
.hl { color: var(--accent); }

/* scene 2 */
.node { width: 300px; height: 150px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.node .t { font: 600 24px/1.15 var(--sans); }
.node .s { color: var(--text-2); font-size: 15px; }
.astrow { display: flex; flex-wrap: wrap; gap: 6px; }
.rec { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px; color: var(--text-2); }
.rec b { font-weight: 500; color: var(--text); }
.rec i { color: var(--text); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* scene 3: the app */
#cam3 { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 40%; }
#world3 { position: absolute; left: 40px; top: 150px; width: 1000px; height: 2680px; transform-style: preserve-3d; transform-origin: 50% 0; }
.side { position: absolute; left: 0; top: 0; width: 250px; height: 1240px; padding: 18px; }
.nav { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 12px; font-size: 15px; color: var(--text-2); }
.nav.on { background: var(--panel-3); color: var(--text); font-weight: 600; }
.nav .ic { width: 16px; height: 16px; border-radius: 4px; border: 1.6px solid var(--text-3); }
.nav.on .ic { border-color: var(--accent); }
.kbd { font: 11px var(--mono); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--text-3); margin-left: auto; }
.kpi { width: 248px; height: 170px; padding: 18px 20px; }
.kpi .k { font-size: 14px; color: var(--text-3); }
.kpi .v { font: 600 44px/1 var(--sans); margin-top: 14px; letter-spacing: -0.02em; }
.kpi .v small { font-size: 22px; color: var(--text-3); font-weight: 500; }
.kpi .sub { font-size: 13px; color: var(--text-3); margin-top: 12px; line-height: 1.4; }
.ctitle { font: 600 18px var(--sans); }
.notice { display: flex; gap: 12px; align-items: flex-start; }
.notice .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 600 15px var(--sans); flex: none; }

/* scene 4 */
.lane { position: absolute; height: 26px; border-radius: 7px; display: flex; align-items: center; padding: 0 9px; font: 600 13px var(--sans); color: #fff; white-space: nowrap; overflow: hidden; }
.tag { position: absolute; font: 500 14px var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 12px; }
.tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
.ccard { width: 270px; height: 150px; padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; }
.ccard .o { font: italic 600 17px/1.2 var(--sans); }
.bed { width: 220px; height: 130px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.panel { position: absolute; padding: 22px 24px; }

/* scene 5 */
.word { position: absolute; left: 0; width: 1080px; text-align: center; }
.urlpill { display: inline-block; padding: 24px 40px; border-radius: 999px; border: 2px solid var(--accent); background: rgba(242,107,58,0.12); font: 600 46px/1 var(--sans); letter-spacing: -0.01em; color: #fff; }
.qr { padding: 26px; border-radius: 30px; background: #fff; line-height: 0; }
.word span { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="layer" id="L1"></div>
  <div class="layer" id="L2"></div>
  <div class="layer" id="L3"><div id="cam3"><div id="world3"></div></div></div>
  <div class="layer" id="L4"></div>
  <div class="layer" id="L5"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="flash"></div>
</div>
<script src="data.js"></script>
<script>
'use strict';
const D = window.DATA;
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;

// ── maths & motion ───────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outCubic: p => 1 - Math.pow(1 - p, 3), inCubic: p => p * p * p, outQuint: p => 1 - Math.pow(1 - p, 5),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)), inExpo: p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  inOutExpo: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },

/** Damped spring 0→1 over time since `start` (overshoot + settle). */

let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = a => a[Math.floor(rnd() * a.length)];

function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; }

  e.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(1)}px)${rx ? ` rotateX(${rx}deg)` : ''}${ry ? ` rotateY(${ry}deg)` : ''}${r ? ` rotate(${r.toFixed(2)}deg)` : ''} scale(${(o.sx ?? s).toFixed(4)},${(o.sy ?? s).toFixed(4)})`;
  e.style.opacity = op.toFixed(3);
  const b = o.blur ?? 0; e.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
  e.style.visibility = op <= 0.002 ? 'hidden' : 'visible';
}
const show = (e, on) => { e.style.display = on ? '' : 'none'; };
const fmtInt = v => Math.round(v).toLocaleString('en-GB');
const sCell = v => (v == null ? 'c-none' : v >= 80 ? 'c-good' : v >= 50 ? 'c-warn' : 'c-crit');
const awareColor = g => (g === 'Access' ? 'var(--good)' : g === 'Watch' ? 'var(--warn)' : g === 'Reserve' ? 'var(--crit)' : 'var(--text-3)');
const LOGO = (size, stroke = 'var(--accent)') => `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="${stroke}" stroke-width="3"/><ellipse cx="16" cy="16" rx="15" ry="6" fill="none" stroke="${stroke}" stroke-width="2" transform="rotate(-28 16 16)" opacity="0.7"/><circle cx="16" cy="16" r="4.5" fill="${stroke}"/></svg>`;

const $ = id => document.getElementById(id);
const L = { 1: $('L1'), 2: $('L2'), 3: $('L3'), 4: $('L4'), 5: $('L5') };
const WINDOWS = { 1: [0, 5.35], 2: [4.95, 12.25], 3: [11.85, 25.2], 4: [24.85, 36.6], 5: [35.85, 50.1] };
// QR code for the download page (generated with the app's qrcode package; error correction M).
const QR_SVG = '<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h33v33H0z"/><path stroke="#0a0a0a" d="M0 0.5h7m3 0h3m8 0h2m3 0h7M0 1.5h1m5 0h1m1 0h2m2 0h3m2 0h1m8 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h4m1 0h1m2 0h3m2 0h2m1 0h1m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h1m2 0h2m2 0h1m3 0h1m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m2 0h2m1 0h1m2 0h1m2 0h1m2 0h1m1 0h1m2 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m3 0h1m1 0h1m1 0h1m1 0h1m3 0h1m1 0h1m3 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h1m2 0h1m10 0h2M0 8.5h1m5 0h1m1 0h1m2 0h1m1 0h3m1 0h1m4 0h5m2 0h3M1 9.5h3m1 0h1m2 0h1m1 0h1m1 0h1m1 0h2m2 0h2m3 0h1m4 0h3M1 10.5h1m2 0h3m1 0h2m1 0h2m2 0h2m1 0h1m2 0h2m2 0h1m2 0h1m1 0h2M0 11.5h1m2 0h1m1 0h1m2 0h1m3 0h1m1 0h1m5 0h1m2 0h2m2 0h5M0 12.5h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h11m1 0h1m1 0h2m3 0h1M0 13.5h1m1 0h4m1 0h1m1 0h1m4 0h1m1 0h1m3 0h1m2 0h1m2 0h2m1 0h1m1 0h2M1 14.5h7m2 0h1m3 0h1m2 0h3m4 0h3m1 0h2m1 0h1M0 15.5h2m1 0h3m1 0h9m2 0h2m2 0h1m2 0h1m2 0h3m1 0h1M2 16.5h1m1 0h3m2 0h1m4 0h1m2 0h4m1 0h4m1 0h2m3 0h1M0 17.5h2m6 0h3m1 0h1m2 0h7m1 0h1m2 0h1m2 0h2m1 0h1M3 18.5h1m1 0h2m1 0h2m1 0h2m1 0h2m3 0h1m3 0h1m3 0h1m1 0h2m1 0h1M0 19.5h3m1 0h2m2 0h3m1 0h2m1 0h4m2 0h1m1 0h4m1 0h3m1 0h1M0 20.5h7m1 0h2m6 0h1m2 0h4m1 0h2m1 0h3M0 21.5h1m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m2 0h3m1 0h4m1 0h1m2 0h2M0 22.5h1m3 0h1m1 0h2m1 0h5m1 0h3m2 0h1m1 0h1m1 0h1m1 0h1m1 0h4M0 23.5h1m2 0h2m4 0h2m7 0h1m3 0h2m1 0h1m1 0h4m1 0h1M0 24.5h2m1 0h1m1 0h4m1 0h1m1 0h5m2 0h2m1 0h1m1 0h6M8 25.5h1m3 0h1m2 0h1m2 0h3m2 0h2m3 0h1m1 0h1m1 0h1M0 26.5h7m3 0h2m3 0h2m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h2M0 27.5h1m5 0h1m2 0h1m4 0h2m3 0h1m3 0h2m3 0h5M0 28.5h1m1 0h3m1 0h1m2 0h2m2 0h1m4 0h1m2 0h1m2 0h6m2 0h1M0 29.5h1m1 0h3m1 0h1m3 0h2m4 0h2m2 0h3m1 0h2m1 0h4m1 0h1M0 30.5h1m1 0h3m1 0h1m2 0h1m1 0h1m2 0h1m1 0h3m1 0h1m3 0h1m2 0h2m1 0h3M0 31.5h1m5 0h1m2 0h1m1 0h3m1 0h2m2 0h2m4 0h1m1 0h2m1 0h1M0 32.5h7m1 0h6m3 0h1m1 0h1m2 0h6m3 0h1"/></svg>';


// ═══════════ SCENE 1 · the data problem (0–5 s) ═══════════
const S1 = { frags: [], lines: [] };
(function build1() {
  const P = D.patient, texts = [];
  D.cultures.forEach(c => {
    texts.push({ t: c.organism, c: 'org' });
    texts.push({ t: `${c.specimen} · ${c.date}`, c: '' });
    c.ast.slice(0, 2).forEach(([d, r]) => texts.push({ t: `${d}  ${r}`, c: `pill ${r === 'R' ? 'r' : r === 'S' ? 's' : ''}` }));
    if (c.mdr) texts.push({ t: 'MDR', c: 'pill r' });
  });
  D.census.forEach(b => { texts.push({ t: `Bed ${b.bed} · ${b.dx}`, c: 'big' }); texts.push({ t: `${b.id} · ${b.resp}`, c: 'pill' }); b.abx.forEach(a => texts.push({ t: a, c: '' })); });
  P.vitals.forEach(v => { texts.push({ t: `HR ${v.hr} /min`, c: 'pill' }); texts.push({ t: `SBP ${v.sbp} mmHg`, c: 'pill' }); if (v.lactate) texts.push({ t: `Lactate ${v.lactate} mmol/L`, c: 'pill r' }); texts.push({ t: v.at.replace('T', ' '), c: '' }); });
  D.stewardship.months.forEach(m => texts.push({ t: `${m.month} · DOT ${m.per1000}`, c: '' }));
  texts.push({ t: `PIM3 ${(P.pim3 * 100).toFixed(1)}%`, c: 'pill' }, { t: `SMR ${D.dashboard.smr.smr.toFixed(2)}`, c: 'big' }, { t: `${D.antibiogram.isolates} isolates`, c: 'big' });
  for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
  const N = 170;
  for (let i = 0; i < N; i++) {
    const f = texts[i % texts.length];
    const e = el('div', `frag ${f.c}`, L[1], f.t);
    const ang = rnd() * Math.PI * 2, rad = 120 + Math.pow(rnd(), 0.7) * 1050;
    // portrait: the cloud is tall rather than wide
    S1.frags.push({ e, ts: 4.55 * Math.pow(i / N, 0.62), x: CX + Math.cos(ang) * rad * 0.6, y: CY + Math.sin(ang) * rad * 1.05, d: 0.55 + rnd() * 1.05, rot: (rnd() - 0.5) * 6 });
  }
  for (let k = 0; k < 6; k++) {
    const series = k % 2 ? D.dashboard.censusPrev : D.stewardship.months.map(m => m.per1000);
    const pts = series.filter(v => v != null).map((v, i, a) => `${(i / (a.length - 1)) * 160},${40 - (v / Math.max(...a)) * 36}`).join(' ');
    const e = el('div', 'frag', L[1], `<svg width="160" height="42"><polyline points="${pts}" fill="none" stroke="${k % 3 ? 'var(--accent)' : 'var(--info-ink)'}" stroke-width="2"/></svg>`);
    const ang = rnd() * Math.PI * 2, rad = 260 + rnd() * 700;
    S1.frags.push({ e, ts: 0.6 + k * 0.62, x: CX + Math.cos(ang) * rad * 0.55, y: CY + Math.sin(ang) * rad, d: 0.8 + rnd() * 0.6, rot: 0 });
  }
  S1.veil = el('div', 'abs', L[1]); S1.veil.style.cssText += `width:${W}px;height:${H}px;background:radial-gradient(75% 40% at 50% 50%, rgba(10,10,10,0.92), rgba(10,10,10,0.55) 70%, rgba(10,10,10,0.2));`;
  const mk = (words, y) => { const h = el('div', 'headline', L[1]); h.style.top = `${y}px`; const spans = words.map(w => el('span', w.hl ? 'hl' : '', h, w.t)); return { h, spans }; };
  S1.lines = [
    mk([{ t: 'PICU ' }, { t: 'data' }], 845), mk([{ t: 'is ' }, { t: 'everywhere.' }], 950),
    mk([{ t: 'The ' }, { t: 'intelligence', hl: 1 }], 790), mk([{ t: 'is ' }, { t: 'hidden' }], 895), mk([{ t: 'inside ' }, { t: 'it.' }], 1000),
  ];
})();
function render1(t) {
  const collapse = seg(t, 4.78, 5.15), pull = seg(t, 4.55, 4.78);
  const dim = Math.max(seg(t, 2.35, 2.75) * 0.75, 0);
  S1.frags.forEach(f => {
    const a = t - f.ts;
    if (a < 0) { put(f.e, { o: 0 }); return; }
    const grow = 1 + 0.22 * a;
    let x = CX + (f.x - CX) * (1 + 0.16 * a) * (1 + 0.04 * pull), y = CY + (f.y - CY) * (1 + 0.16 * a) * (1 + 0.04 * pull);
    const c = E.inExpo(collapse);
    x = lerp(x, CX, c); y = lerp(y, CY, c);
    const op = E.outCubic(seg(a, 0, 0.18)) * (1 - dim * 0.8) * (1 - c) * (f.d < 0.75 ? 0.55 : 1);
    put(f.e, { x: x - 80, y: y - 14, s: f.d * grow * (1 - c * 0.85), r: f.rot, o: op, blur: (f.d < 0.75 ? 2.4 : f.d > 1.45 ? 1.6 : 0) + c * 6 });
  });

  S5.sub = el('div', 'word', L[5], 'PICU Intelligence'); S5.sub.style.cssText += 'top:750px;font:500 36px/1 var(--sans);color:var(--text-2);text-transform:uppercase';
  S5.tag = el('div', 'word', L[5], 'Turn PICU data into<br><span style="color:var(--accent)">intelligence.</span>'); S5.tag.style.cssText += 'top:840px;font:500 52px/1.18 var(--sans);letter-spacing:-0.015em';
  // download card
  S5.ctaLabel = el('div', 'word mono', L[5], 'Free download · Windows'); S5.ctaLabel.style.cssText += 'top:1070px;font-size:24px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-3)';
  S5.url = el('div', 'word', L[5], '<span class="urlpill">itskaero.github.io/antibiome</span>'); S5.url.style.cssText += 'top:1130px';
  S5.pill = S5.url.firstChild;
  S5.qr = el('div', 'abs', L[5], `<div class="qr">${QR_SVG}</div>`);
  S5.qrCap = el('div', 'word', L[5], 'Scan to open the download page'); S5.qrCap.style.cssText += 'top:1625px;font:500 26px var(--sans);color:var(--text-2)';
  S5.foot = el('div', 'word', L[5], 'Windows 10 &amp; 11 · Windows 7 edition · 32- and 64-bit'); S5.foot.style.cssText += 'top:1700px;font:400 23px var(--sans);color:var(--text-3)';
})();
function render5(t) {
  const fade = 1 - seg(t, 49.3, 50);
  // the brand lockup sits lower until the download card arrives, then lifts to make room
  const lift = lerp(330, 0, E.inOutCubic(seg(t, 41.6, 42.4)));
  const conv = E.inOutCubic(seg(t, 36.0, 37.6));
  S5.dots.forEach(d => {
    const a = d.a + t * (0.6 + d.k * 0.8), r = lerp(d.r, 130, conv) * (1 - seg(t, 37.6, 38.0) * 0.98);
    put(d.e, { x: CX + Math.cos(a) * r * 0.75 - 3, y: CY - 60 + Math.sin(a) * r - 3, o: seg(t, 35.95 + d.k * 0.4, 36.2 + d.k * 0.4) * (1 - seg(t, 37.85, 38.05)), s: 1 - conv * 0.4 });
  });
  S5.ring.setAttribute('stroke-dashoffset', String(100 - E.inOutCubic(seg(t, 37.15, 37.95)) * 100));
  S5.orb.setAttribute('stroke-dashoffset', String(100 - E.inOutCubic(seg(t, 37.35, 38.0)) * 100));
  const core = spring(t, 38.0, 2.4, 0.38); S5.core.setAttribute('r', String(4.5 * clamp(core, 0, 1.4)));
  const up = E.inOutCubic(seg(t, 38.35, 39.1));
  const ls = lerp(1, 0.42, up), logoCy = lerp(CY - 60, LOGO_Y + lift, up);
  put(S5.logo, { x: CX - 210, y: logoCy - 210, s: ls * (1 + 0.04 * Math.sin(Math.max(0, t - 38) * 1.4) * (1 - up)), o: seg(t, 37.1, 37.3) * fade });
  put(S5.glow, { x: CX - 450, y: logoCy - 450, s: 0.6 + spring(t, 38.0, 1.4, 0.5) * 0.5, o: seg(t, 37.9, 38.1) * (0.9 - 0.4 * up) * fade });
  S5.letters.forEach((l, i) => { const a = 38.6 + i * 0.045, p = spring(t, a, 2.2, 0.5); put(l, { y: (1 - p) * 70, o: seg(t, a, a + 0.15) * fade, blur: (1 - clamp(p)) * 8 }); });
  S5.word.style.transform = `translateY(${lift.toFixed(1)}px)`;
  const sp = E.outCubic(seg(t, 39.3, 40.3)); S5.sub.style.letterSpacing = `${lerp(0.7, 0.32, sp)}em`; put(S5.sub, { y: lift, o: sp * fade });
  const tp = E.outCubic(seg(t, 40.4, 41.2)); put(S5.tag, { y: lift + (1 - tp) * 24, o: tp * fade, blur: (1 - tp) * 6 });
  // download card: label, link, QR code
  const lp = E.outCubic(seg(t, 41.9, 42.4)); put(S5.ctaLabel, { y: (1 - lp) * 20, o: lp * fade });
  const up2 = spring(t, 42.2, 2.0, 0.5); put(S5.url, { y: (1 - clamp(up2)) * 40, s: 0.9 + 0.1 * up2, o: seg(t, 42.2, 42.35) * fade });
  const glow = 0.5 + 0.5 * Math.sin(Math.max(0, t - 43) * 2.4);
  S5.pill.style.boxShadow = `0 0 ${(18 + 26 * glow).toFixed(1)}px rgba(242,107,58,${(0.25 + 0.3 * glow * seg(t, 43, 43.5)).toFixed(3)})`;
  const qp = spring(t, 42.9, 1.8, 0.55); put(S5.qr, { x: CX - 176, y: 1250 + (1 - clamp(qp)) * 60, s: 0.85 + 0.15 * qp, o: seg(t, 42.9, 43.05) * fade });
  const cp = E.outCubic(seg(t, 43.4, 43.9)); put(S5.qrCap, { y: (1 - cp) * 16, o: cp * fade }); put(S5.foot, { y: (1 - cp) * 16, o: seg(t, 43.6, 44.1) * fade });
}

// ═══════════ global: background, grain, flashes ═══════════
const grain = $('grain').getContext('2d'), gimg = grain.createImageData(540, 960);
function renderGlobal(t) {
  // background light tracks the story: cold data → warm intelligence
  const warm = seg(t, 24, 34);
  const g1 = `rgba(${Math.round(lerp(40, 242, warm))},${Math.round(lerp(70, 107, warm))},${Math.round(lerp(130, 58, warm))},${(0.18 + 0.08 * Math.sin(t * 0.7)).toFixed(3)})`;
  $('bg').style.background = `radial-gradient(55% 60% at ${50 + 8 * Math.sin(t * 0.21)}% ${45 + 6 * Math.cos(t * 0.17)}%, ${g1}, transparent 70%), radial-gradient(40% 50% at 15% 85%, rgba(57,135,229,${(0.08 * (1 - warm)).toFixed(3)}), transparent 70%), #0a0a0a`;
  // film grain, deterministic per frame
  let s = Math.floor(t * 15) * 2654435761 % 4294967296; // grain refreshes every other frame (texture without killing compression)
  for (let i = 0; i < gimg.data.length; i += 4) { s = (s * 1664525 + 1013904223) % 4294967296; const v = (s >>> 24); gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
  grain.putImageData(gimg, 0, 0);
  // impact flashes on the big hits
  const hits = [5.0, 12.0, 25.0, 33.0, 38.0];
  const f = Math.max(...hits.map(h => (t >= h ? Math.exp(-(t - h) * 9) : 0)));
  $('flash').style.opacity = (f * 0.22).toFixed(3);
  $('stage').style.opacity = String(seg(t, 0, 0.4));
}

window.seek = function (t) {
  for (const k of [1, 2, 3, 4, 5]) { const [a, b] = WINDOWS[k]; const on = t >= a && t <= b; show(L[k], on); }
  if (t <= WINDOWS[1][1]) render1(t);
  if (t >= WINDOWS[2][0] && t <= WINDOWS[2][1]) render2(t);
  if (t >= WINDOWS[3][0] && t <= WINDOWS[3][1]) render3(t);
  if (t >= WINDOWS[4][0] && t <= WINDOWS[4][1]) render4(t);
  if (t >= WINDOWS[5][0]) render5(t);
  renderGlobal(t);
};
window.DURATION = 50;
// Preview: ?t=12.5 renders one frame; ?play plays in real time.
const q = new URLSearchParams(location.search);
if (q.has('t')) seek(parseFloat(q.get('t'))); else if (q.has('play')) { const t0 = performance.now(); (function loop(now) { seek(((now - t0) / 1000) % 50); requestAnimationFrame(loop); })(t0); } else seek(0);
</script>
